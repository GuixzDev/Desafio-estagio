<div class="container">
  <div class="box">
    <h2>Cadastro de Entregas</h2>

    <div *ngIf="feedbackMessage" [ngClass]="feedbackType" class="message">
      {{ feedbackMessage }}
    </div>

    <form [formGroup]="recordForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="funcionario_id">Funcionário *</label>
        <select id="funcionario_id" formControlName="funcionario_id">
          <option value="" disabled>Selecione um funcionário</option>
          <option *ngFor="let emp of employees" [value]="emp.id">
            {{ emp.nome }} ({{ emp.departamento }})
          </option>
        </select>
        <span *ngIf="recordForm.get('funcionario_id')?.invalid && recordForm.get('funcionario_id')?.touched" class="error">
          Campo obrigatório
        </span>
      </div>

      <div class="field">
        <label for="data_referencia">Data de Referência *</label>
        <input type="date" id="data_referencia" formControlName="data_referencia" />
        <span *ngIf="recordForm.get('data_referencia')?.invalid && recordForm.get('data_referencia')?.touched" class="error">
          Campo obrigatório
        </span>
      </div>

      <div class="field">
        <label for="quantidade_entregas">Quantidade de Entregas *</label>
        <input type="number" id="quantidade_entregas" min="0" formControlName="quantidade_entregas" />
        <span *ngIf="recordForm.get('quantidade_entregas')?.invalid && recordForm.get('quantidade_entregas')?.touched" class="error">
          Informe um valor maior ou igual a zero
        </span>
      </div>

      <div class="field">
        <label for="observacao">Observação</label>
        <textarea id="observacao" formControlName="observacao" rows="3"></textarea>
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Salvando...' : 'Salvar Registro' }}
      </button>
    </form>
  </div>
</div>
